name: Cleanup old workflow runs

on:
  workflow_dispatch:
    inputs:
      keep:
        description: 'عدد آخر التشغيلات لي تبقى'
        required: true
        default: '10'

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: ${{ github.event.inputs.keep }}
