          # ⭐ 2026-09-22 (بطلب المستخدم — تخزين حقيقي فبطاقة SD القابلة للنزع):
          # المستخدم كيختار مجلد مرة وحدة عبر نافذة النظام (Storage Access
          # Framework)، والإذن كيتحفظ بشكل دائم (takePersistableUriPermission).
          # من بعد، كل كتابة/قراءة كتصدا مباشرة فذاك المجلد بلا ما يتسول
          # المستخدم مرة أخرى، والملف كيبقى موجود حتى بعد حذف/إعادة تثبيت
          # التطبيق (لأنه خارج مجلد التطبيق).
          cat > android/app/src/main/java/com/achfrirachid/tatabbou/SafFolderPlugin.java << 'EOF'
          package com.achfrirachid.tatabbou;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import androidx.activity.result.ActivityResult;
          import androidx.documentfile.provider.DocumentFile;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.io.ByteArrayOutputStream;
          @CapacitorPlugin(name = "SafFolder")
          public class SafFolderPlugin extends Plugin {
              private static final String PREFS = "saf_storage_prefs";
              private static final String KEY_URI = "saf_folder_uri";
              private SharedPreferences prefs() {
                  return getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }
              @PluginMethod
              public void pickFolder(PluginCall call) {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION
                          | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(call, intent, "pickFolderResult");
              }
              @ActivityCallback
              private void pickFolderResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  JSObject ret = new JSObject();
                  if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null) {
                      ret.put("uri", (String) null);
                      call.resolve(ret);
                      return;
                  }
                  Uri uri = result.getData().getData();
                  if (uri == null) {
                      ret.put("uri", (String) null);
                      call.resolve(ret);
                      return;
                  }
                  try {
                      getContext().getContentResolver().takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      );
                  } catch (Exception e) { /* بعض الأجهزة كتعطي الإذن مباشرة بلا الحاجة لهاد السطر */ }
                  prefs().edit().putString(KEY_URI, uri.toString()).apply();
                  ret.put("uri", uri.toString());
                  call.resolve(ret);
              }
              @PluginMethod
              public void hasFolder(PluginCall call) {
                  String saved = prefs().getString(KEY_URI, null);
                  JSObject ret = new JSObject();
                  if (saved == null) { ret.put("uri", (String) null); call.resolve(ret); return; }
                  try {
                      DocumentFile dir = DocumentFile.fromTreeUri(getContext(), Uri.parse(saved));
                      if (dir != null && dir.canWrite()) { ret.put("uri", saved); call.resolve(ret); return; }
                  } catch (Exception e) { /* الإذن ولا كاين */ }
                  prefs().edit().remove(KEY_URI).apply();
                  ret.put("uri", (String) null);
                  call.resolve(ret);
              }
              @PluginMethod
              public void clearFolder(PluginCall call) {
                  prefs().edit().remove(KEY_URI).apply();
                  call.resolve();
              }
              @PluginMethod
              public void writeFile(PluginCall call) {
                  String filename = call.getString("filename");
                  String data = call.getString("data");
                  if (filename == null || data == null) { call.reject("filename_and_data_required"); return; }
                  String saved = prefs().getString(KEY_URI, null);
                  if (saved == null) { call.reject("no_folder_selected"); return; }
                  try {
                      DocumentFile dir = DocumentFile.fromTreeUri(getContext(), Uri.parse(saved));
                      if (dir == null || !dir.canWrite()) { call.reject("folder_not_writable"); return; }
                      DocumentFile existing = dir.findFile(filename);
                      if (existing != null) existing.delete();
                      DocumentFile file = dir.createFile("application/json", filename);
                      if (file == null) { call.reject("create_file_failed"); return; }
                      OutputStream os = getContext().getContentResolver().openOutputStream(file.getUri(), "wt");
                      if (os == null) { call.reject("open_stream_failed"); return; }
                      os.write(data.getBytes("UTF-8"));
                      os.flush();
                      os.close();
                      JSObject ret = new JSObject();
                      ret.put("ok", true);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("write_failed: " + e.getMessage());
                  }
              }
              @PluginMethod
              public void readFile(PluginCall call) {
                  String filename = call.getString("filename");
                  if (filename == null) { call.reject("filename_required"); return; }
                  String saved = prefs().getString(KEY_URI, null);
                  if (saved == null) { call.reject("no_folder_selected"); return; }
                  try {
                      DocumentFile dir = DocumentFile.fromTreeUri(getContext(), Uri.parse(saved));
                      if (dir == null) { call.reject("folder_not_found"); return; }
                      DocumentFile file = dir.findFile(filename);
                      if (file == null) { call.reject("file_not_found"); return; }
                      InputStream is = getContext().getContentResolver().openInputStream(file.getUri());
                      if (is == null) { call.reject("open_stream_failed"); return; }
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = is.read(buf)) != -1) bos.write(buf, 0, n);
                      is.close();
                      JSObject ret = new JSObject();
                      ret.put("data", new String(bos.toByteArray(), "UTF-8"));
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("read_failed: " + e.getMessage());
                  }
              }
          }
          EOF
          # ⭐ مزامنة تلقائية: خدمة أمامية صامتة (بلا أيقونة) + استقبال بعد إعادة تشغيل الهاتف
          cat > android/app/src/main/java/com/achfrirachid/tatabbou/LanSyncService.java << 'EOF'
          package com.achfrirachid.tatabbou;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.atomic.AtomicLong;

          /** خدمة أمامية دائمة: كتبقى كتسمع على البورت حتى والهاتف مقفول، وكتخزن الرسائل فملفات حتى يفتح التطبيق. */
          public class LanSyncService extends Service {
              static final int PORT = 8765;
              private static final String CH = "lansync_ch2";
              private static final String ALERT_CH = "lansync_alert2";
              private static volatile long lastAlert = 0;
              private static final AtomicLong SEQ = new AtomicLong(0);
              private ServerSocket server;
              private volatile boolean running = false;
              private ExecutorService pool;
              private PowerManager.WakeLock wl;
              private WifiManager.WifiLock wfl;

              static File queueDir(Context c) {
                  File d = new File(c.getFilesDir(), "lansync_queue");
                  if (!d.exists()) d.mkdirs();
                  return d;
              }

              @Override public IBinder onBind(Intent i) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  try {
                      Notification n = buildNotification();
                      if (Build.VERSION.SDK_INT >= 34) startForeground(7765, n, 0x40000000); // FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      else startForeground(7765, n);
                  } catch (Throwable t) { }
                  try {
                      WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      if (wfl == null) { wfl = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "tatabbou:lansync"); wfl.setReferenceCounted(false); }
                      if (!wfl.isHeld()) wfl.acquire();
                  } catch (Throwable t) { }
                  if (!running) startServer();
                  return START_STICKY;
              }

              private Notification buildNotification() {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26 && nm != null) {
                      NotificationChannel ch = new NotificationChannel(CH, "مزامنة الهاتفين", NotificationManager.IMPORTANCE_MIN);
                      ch.setShowBadge(false);
                      nm.createNotificationChannel(ch);
                  }
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CH) : new Notification.Builder(this);
                  b.setContentTitle("🔗 مزامنة الهاتفين خدامة")
                   .setContentText("كتسنى التعديلات من الهاتف الآخر عبر الروتر")
                   .setSmallIcon(android.R.drawable.stat_notify_sync)
                   .setOngoing(true);
                  try {
                      Intent li = getPackageManager().getLaunchIntentForPackage(getPackageName());
                      if (li != null) {
                          int fl = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                          b.setContentIntent(PendingIntent.getActivity(this, 0, li, fl));
                      }
                  } catch (Throwable t) { }
                  return b.build();
              }

              private void notifyArrived() {
                  try {
                      long now = System.currentTimeMillis();
                      if (now - lastAlert < 8000) return;
                      lastAlert = now;
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= 26 && nm != null) {
                          NotificationChannel ch = new NotificationChannel(ALERT_CH, "وصول تعديلات من الهاتف الآخر", NotificationManager.IMPORTANCE_HIGH);
                          ch.setSound(android.provider.Settings.System.DEFAULT_NOTIFICATION_URI,
                                  new android.media.AudioAttributes.Builder()
                                          .setUsage(android.media.AudioAttributes.USAGE_NOTIFICATION)
                                          .setContentType(android.media.AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
                          ch.enableVibration(true);
                          nm.createNotificationChannel(ch);
                      }
                      Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, ALERT_CH) : new Notification.Builder(this);
                      b.setContentTitle("📥 وصلات تعديلات من الهاتف الآخر")
                       .setContentText("المعلومات وصلات — حل التطبيق باش تتسجل")
                       .setSmallIcon(android.R.drawable.stat_notify_sync).setAutoCancel(true);
                      if (Build.VERSION.SDK_INT < 26) b.setDefaults(Notification.DEFAULT_ALL);
                      Intent li = getPackageManager().getLaunchIntentForPackage(getPackageName());
                      if (li != null) b.setContentIntent(PendingIntent.getActivity(this, 1, li, Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0));
                      if (nm != null) nm.notify(7766, b.build());
                  } catch (Throwable t) { }
              }

              private void startServer() {
                  pool = Executors.newFixedThreadPool(6);
                  try {
                      server = new ServerSocket();
                      server.setReuseAddress(true);
                      server.bind(new InetSocketAddress(PORT));
                      running = true;
                  } catch (Throwable t) { running = false; return; }
                  new Thread(new Runnable() {
                      public void run() {
                          while (running) {
                              try {
                                  final Socket c = server.accept();
                                  pool.execute(new Runnable() { public void run() { handle(c); } });
                              } catch (Throwable t) { if (!running) break; }
                          }
                      }
                  }, "lansync-accept").start();
              }

              private void handle(Socket c) {
                  try {
                      c.setSoTimeout(30000);
                      BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"), 65536);
                      String line = r.readLine();
                      OutputStream o = c.getOutputStream();
                      if ("LANSYNC_PING".equals(line)) {
                          o.write("LANSYNC_PONG\n".getBytes("UTF-8")); o.flush();
                      } else if (line != null && line.startsWith("LANSYNC_MSG ")) {
                          String from = c.getInetAddress().getHostAddress();
                          String data = line.substring(12);
                          File dir = queueDir(this);
                          String name = String.format("%015d_%06d", System.currentTimeMillis(), SEQ.incrementAndGet());
                          File tmp = new File(dir, name + ".tmp");
                          FileOutputStream fo = new FileOutputStream(tmp);
                          fo.write((from + "\n" + data).getBytes("UTF-8"));
                          fo.flush(); fo.close();
                          if (tmp.renameTo(new File(dir, name + ".msg"))) {
                              o.write("OK\n".getBytes("UTF-8")); o.flush();
                              if (data.startsWith("R|") && !LanSyncPlugin.fg) notifyArrived();
                              LanSyncPlugin.pokePending();
                          }
                      }
                  } catch (Throwable t) { }
                  finally { try { c.close(); } catch (Throwable t) { } }
              }

              @Override
              public void onDestroy() {
                  running = false;
                  try { if (server != null) server.close(); } catch (Throwable t) { }
                  server = null;
                  try { if (pool != null) pool.shutdownNow(); } catch (Throwable t) { }
                  try { if (wl != null && wl.isHeld()) wl.release(); } catch (Throwable t) { }
                  try { if (wfl != null && wfl.isHeld()) wfl.release(); } catch (Throwable t) { }
                  super.onDestroy();
              }
          }
          EOF
          cat > android/app/src/main/java/com/achfrirachid/tatabbou/LanSyncBootReceiver.java << 'EOF'
          package com.achfrirachid.tatabbou;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          /** بعد ما يتشعل الهاتف من جديد: إلا كانت المزامنة مفعلة، كتشغل الخدمة أوتوماتيك بلا ما يتحل التطبيق. */
          public class LanSyncBootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context ctx, Intent intent) {
                  try {
                      if (!ctx.getSharedPreferences("lansync_prefs", Context.MODE_PRIVATE).getBoolean("on", false)) return;
                      Intent i = new Intent(ctx, LanSyncService.class);
                      if (Build.VERSION.SDK_INT >= 26) ctx.startForegroundService(i); else ctx.startService(i);
                  } catch (Throwable t) { }
              }
          }
          EOF
          cat > android/app/src/main/java/com/achfrirachid/tatabbou/LanSyncPlugin.java << 'EOF'
          package com.achfrirachid.tatabbou;

          import android.content.Context;
          import android.content.Intent;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.Inet4Address;
          import java.net.InetAddress;
          import java.net.InetSocketAddress;
          import java.net.NetworkInterface;
          import java.net.Socket;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.Future;
          import java.util.concurrent.TimeUnit;

          /** مزامنة محلية بين هاتفين عبر نفس الروتر (بلا إنترنت). السيرفر كيخدم فـ LanSyncService (خدمة أمامية)، هنا غير الإرسال والبحث وقراءة الرسائل المخزنة. */
          @CapacitorPlugin(name = "LanSync")
          public class LanSyncPlugin extends Plugin {
              static final int PORT = 8765;
              static volatile LanSyncPlugin instance;
              static volatile boolean fg = false;
              private final ExecutorService pool = Executors.newFixedThreadPool(8);
              private final ExecutorService scanPool = Executors.newFixedThreadPool(48);

              @Override
              public void load() { instance = this; }

              @Override
              protected void handleOnResume() {
                  fg = true;
                  try { ((android.app.NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE)).cancel(7766); } catch (Throwable t) { }
              }

              @Override
              protected void handleOnPause() { fg = false; }

              static void pokePending() {
                  LanSyncPlugin p = instance;
                  if (p != null) {
                      try { p.notifyListeners("pending", new JSObject()); } catch (Throwable t) { }
                  }
              }

              private Network wifiNet() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getContext().getSystemService(Context.CONNECTIVITY_SERVICE);
                      for (Network n : cm.getAllNetworks()) {
                          NetworkCapabilities c = cm.getNetworkCapabilities(n);
                          if (c != null && c.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) return n;
                      }
                  } catch (Throwable t) { }
                  return null;
              }

              // الروتر بلا إنترنت → أندرويد يمكن يدوز بالداتا؛ كنربطو السوكيت بـ Wi-Fi مباشرة
              private Socket newSocket() throws Exception {
                  Socket s = new Socket();
                  Network n = wifiNet();
                  if (n != null) { try { n.bindSocket(s); } catch (Throwable t) { } }
                  return s;
              }

              private String localIp() {
                  try {
                      String best = null;
                      for (NetworkInterface ni : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          if (!ni.isUp() || ni.isLoopback()) continue;
                          for (InetAddress a : Collections.list(ni.getInetAddresses())) {
                              if (a instanceof Inet4Address && a.isSiteLocalAddress()) {
                                  String nm = ni.getName();
                                  if (nm.startsWith("wlan") || nm.startsWith("ap") || nm.startsWith("swlan")) return a.getHostAddress();
                                  if (best == null) best = a.getHostAddress();
                              }
                          }
                      }
                      return best;
                  } catch (Throwable t) { return null; }
              }

              @PluginMethod
              public void start(final PluginCall call) {
                  try {
                      getContext().getSharedPreferences("lansync_prefs", Context.MODE_PRIVATE).edit().putBoolean("on", true).apply();
                      Intent i = new Intent(getContext(), LanSyncService.class);
                      if (Build.VERSION.SDK_INT >= 26) getContext().startForegroundService(i);
                      else getContext().startService(i);
                      JSObject r = new JSObject(); r.put("ip", localIp());
                      call.resolve(r);
                  } catch (Throwable t) { call.reject("start failed: " + t.getMessage()); }
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  try { getContext().getSharedPreferences("lansync_prefs", Context.MODE_PRIVATE).edit().putBoolean("on", false).apply(); } catch (Throwable t) { }
                  try { getContext().stopService(new Intent(getContext(), LanSyncService.class)); } catch (Throwable t) { }
                  call.resolve();
              }

              /** كيرجع الرسائل اللي توصلات والتطبيق مقفول/فالخلفية، وكيمسحها من الطابور. */
              @PluginMethod
              public void drain(final PluginCall call) {
                  pool.execute(new Runnable() {
                      public void run() {
                          try {
                              JSArray items = new JSArray();
                              File[] fs = LanSyncService.queueDir(getContext()).listFiles();
                              boolean more = false;
                              if (fs != null) {
                                  Arrays.sort(fs);
                                  int cnt = 0;
                                  for (File f : fs) {
                                      if (!f.getName().endsWith(".msg")) continue;
                                      if (cnt >= 10) { more = true; break; }
                                      try {
                                          InputStream is = new FileInputStream(f);
                                          ByteArrayOutputStream bos = new ByteArrayOutputStream();
                                          byte[] buf = new byte[65536]; int n;
                                          while ((n = is.read(buf)) != -1) bos.write(buf, 0, n);
                                          is.close();
                                          String all = new String(bos.toByteArray(), "UTF-8");
                                          int nl = all.indexOf('\n');
                                          JSObject it = new JSObject();
                                          it.put("from", nl > 0 ? all.substring(0, nl) : "");
                                          it.put("data", nl >= 0 ? all.substring(nl + 1) : all);
                                          items.put(it);
                                          f.delete();
                                          cnt++;
                                      } catch (Throwable t) { f.delete(); }
                                  }
                              }
                              JSObject res = new JSObject();
                              res.put("items", items);
                              res.put("more", more);
                              call.resolve(res);
                          } catch (Throwable t) { call.reject("drain failed: " + t.getMessage()); }
                      }
                  });
              }

              @PluginMethod
              public void isIgnoringBattery(PluginCall call) {
                  JSObject r = new JSObject();
                  boolean ok = true;
                  try {
                      if (Build.VERSION.SDK_INT >= 23) {
                          PowerManager pm = (PowerManager) getContext().getSystemService(Context.POWER_SERVICE);
                          ok = pm.isIgnoringBatteryOptimizations(getContext().getPackageName());
                      }
                  } catch (Throwable t) { }
                  r.put("ignoring", ok);
                  call.resolve(r);
              }

              @PluginMethod
              public void requestIgnoreBattery(PluginCall call) {
                  try {
                      Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                      i.setData(Uri.parse("package:" + getContext().getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                  } catch (Throwable t) { }
                  call.resolve();
              }

              @PluginMethod
              public void send(final PluginCall call) {
                  final String host = call.getString("host");
                  final String data = call.getString("data");
                  if (host == null || data == null) { call.reject("bad args"); return; }
                  pool.execute(new Runnable() {
                      public void run() {
                          Socket s = null;
                          try {
                              s = newSocket();
                              s.connect(new InetSocketAddress(host, PORT), 2500);
                              s.setSoTimeout(30000);
                              OutputStream o = s.getOutputStream();
                              o.write(("LANSYNC_MSG " + data + "\n").getBytes("UTF-8")); o.flush();
                              BufferedReader r = new BufferedReader(new InputStreamReader(s.getInputStream(), "UTF-8"));
                              String ans = r.readLine();
                              JSObject res = new JSObject(); res.put("ok", "OK".equals(ans));
                              call.resolve(res);
                          } catch (Throwable t) { call.reject("send failed: " + t.getMessage()); }
                          finally { try { if (s != null) s.close(); } catch (Throwable t) { } }
                      }
                  });
              }

              private boolean ping(String host) {
                  Socket s = null;
                  try {
                      s = newSocket();
                      s.connect(new InetSocketAddress(host, PORT), 450);
                      s.setSoTimeout(1200);
                      s.getOutputStream().write("LANSYNC_PING\n".getBytes("UTF-8")); s.getOutputStream().flush();
                      BufferedReader r = new BufferedReader(new InputStreamReader(s.getInputStream(), "UTF-8"));
                      return "LANSYNC_PONG".equals(r.readLine());
                  } catch (Throwable t) { return false; }
                  finally { try { if (s != null) s.close(); } catch (Throwable t) { } }
              }

              @PluginMethod
              public void scan(final PluginCall call) {
                  new Thread(new Runnable() {
                      public void run() {
                          JSObject res = new JSObject();
                          JSArray peers = new JSArray();
                          String self = localIp();
                          res.put("ip", self);
                          if (self != null) {
                              String base = self.substring(0, self.lastIndexOf('.') + 1);
                              List<Future<String>> fs = new ArrayList<Future<String>>();
                              for (int i = 1; i <= 254; i++) {
                                  final String h = base + i;
                                  if (h.equals(self)) continue;
                                  fs.add(scanPool.submit(new java.util.concurrent.Callable<String>() {
                                      public String call() { return ping(h) ? h : null; }
                                  }));
                              }
                              for (Future<String> f : fs) {
                                  try { String h = f.get(10, TimeUnit.SECONDS); if (h != null) peers.put(h); } catch (Throwable t) { }
                              }
                          }
                          res.put("peers", peers);
                          call.resolve(res);
                      }
                  }, "lansync-scan").start();
              }
          }
