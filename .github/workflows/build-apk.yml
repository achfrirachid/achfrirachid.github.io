name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Ensure TypeScript is available (needed for capacitor.config.ts)
        run: npm install -D typescript

      - name: Add Android platform (first run only, safe to repeat)
        run: npx cap add android || true

      - name: Upgrade Gradle wrapper (fixes Java-21 multi-release-jar parsing bug in old Gradle)
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

      - name: Add custom WhatsApp share plugin
        run: |
          mkdir -p android/app/src/main/java/com/achfrirachid/tatabbou
          cat > android/app/src/main/java/com/achfrirachid/tatabbou/WhatsAppSharePlugin.java << 'EOF'
          package com.achfrirachid.tatabbou;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          @CapacitorPlugin(name = "WhatsAppShare")
          public class WhatsAppSharePlugin extends Plugin {
              @PluginMethod
              public void shareImage(PluginCall call) {
                  String filePath = call.getString("path");
                  if (filePath == null) {
                      call.reject("path required");
                      return;
                  }
                  try {
                      File file = new File(filePath);
                      Uri uri = FileProvider.getUriForFile(
                          getContext(),
                          getContext().getPackageName() + ".fileprovider",
                          file
                      );
                      Intent intent = new Intent(Intent.ACTION_SEND);
                      intent.setType("image/png");
                      intent.putExtra(Intent.EXTRA_STREAM, uri);
                      intent.setPackage("com.whatsapp");
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      try {
                          getContext().startActivity(intent);
                          JSObject ret = new JSObject();
                          ret.put("opened", true);
                          call.resolve(ret);
                      } catch (android.content.ActivityNotFoundException notFound) {
                          call.reject("whatsapp_not_installed");
                      }
                  } catch (Exception e) {
                      call.reject("share_failed: " + e.getMessage());
                  }
              }
          }
          EOF
