name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Ensure TypeScript is available (needed for capacitor.config.ts)
        run: npm install -D typescript

      - name: Add Android platform (first run only, safe to repeat)
        run: npx cap add android || true

      - name: Upgrade Gradle wrapper (fixes Java-21 multi-release-jar parsing bug in old Gradle)
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

      - name: Add custom WhatsApp share plugin
        run: |
          mkdir -p android/app/src/main/java/com/achfrirachid/tatabbou
          cat > android/app/src/main/java/com/achfrirachid/tatabbou/WhatsAppSharePlugin.java << 'EOF'
          package com.achfrirachid.tatabbou;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          @CapacitorPlugin(name = "WhatsAppShare")
          public class WhatsAppSharePlugin extends Plugin {
              @PluginMethod
              public void shareImage(PluginCall call) {
                  String filePath = call.getString("path");
                  if (filePath == null) {
                      call.reject("path required");
                      return;
                  }
                  try {
                      File file = new File(filePath);
                      Uri uri = FileProvider.getUriForFile(
                          getContext(),
                          getContext().getPackageName() + ".fileprovider",
                          file
                      );
                      Intent intent = new Intent(Intent.ACTION_SEND);
                      intent.setType("image/png");
                      intent.putExtra(Intent.EXTRA_STREAM, uri);
                      intent.setPackage("com.whatsapp");
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      try {
                          getContext().startActivity(intent);
                          JSObject ret = new JSObject();
                          ret.put("opened", true);
                          call.resolve(ret);
                      } catch (android.content.ActivityNotFoundException notFound) {
                          call.reject("whatsapp_not_installed");
                      }
                  } catch (Exception e) {
                      call.reject("share_failed: " + e.getMessage());
                  }
              }
          }
          EOF
          # ⭐ 2026-09-11 (إضافة — مزامنة فالخلفية): بلوجين Native باش JS يقدر
          # يطلب صلاحية الإشعارات أو يفتح إعدادات التطبيق مباشرة.
          cat > android/app/src/main/java/com/achfrirachid/tatabbou/NotificationPermissionPlugin.java << 'EOF'
          package com.achfrirachid.tatabbou;
          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationManagerCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "NotificationPermission")
          public class NotificationPermissionPlugin extends Plugin {
              @PluginMethod
              public void isEnabled(PluginCall call) {
                  boolean enabled = NotificationManagerCompat.from(getContext()).areNotificationsEnabled();
                  JSObject ret = new JSObject();
                  ret.put("enabled", enabled);
                  call.resolve(ret);
              }
              @PluginMethod
              public void request(PluginCall call) {
                  Activity activity = getActivity();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU && activity != null) {
                      boolean granted = ActivityCompat.checkSelfPermission(activity, Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED;
                      if (!granted) {
                          ActivityCompat.requestPermissions(activity, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 9022);
                      }
                  }
                  JSObject ret = new JSObject();
                  ret.put("enabled", NotificationManagerCompat.from(getContext()).areNotificationsEnabled());
                  call.resolve(ret);
              }
              @PluginMethod
              public void openSettings(PluginCall call) {
                  Intent intent = new Intent();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      intent.setAction(Settings.ACTION_APP_NOTIFICATION_SETTINGS);
                      intent.putExtra(Settings.EXTRA_APP_PACKAGE, getContext().getPackageName());
                  } else {
                      intent.setAction(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                      intent.setData(Uri.parse("package:" + getContext().getPackageName()));
                  }
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(intent);
                  call.resolve();
              }
              @PluginMethod
              public void openManageAllFilesAccess(PluginCall call) {
                  JSObject ret = new JSObject();
                  try {
                      Intent intent = new Intent();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          intent.setAction(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                          intent.setData(Uri.parse("package:" + getContext().getPackageName()));
                      } else {
                          intent.setAction(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                          intent.setData(Uri.parse("package:" + getContext().getPackageName()));
                      }
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);
                      ret.put("opened", true);
                  } catch (Exception e) {
                      ret.put("opened", false);
                  }
                  call.resolve(ret);
              }
              @PluginMethod
              public void isManageAllFilesGranted(PluginCall call) {
                  JSObject ret = new JSObject();
                  boolean granted = (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) || Environment.isExternalStorageManager();
                  ret.put("granted", granted);
                  call.resolve(ret);
              }
          }
          EOF
          # ⭐ 2026-09-22 (بطلب المستخدم — تخزين حقيقي فبطاقة SD القابلة للنزع):
          # المستخدم كيختار مجلد مرة وحدة عبر نافذة النظام (Storage Access
          # Framework)، والإذن كيتحفظ بشكل دائم (takePersistableUriPermission).
          # من بعد، كل كتابة/قراءة كتصدا مباشرة فذاك المجلد بلا ما يتسول
          # المستخدم مرة أخرى، والملف كيبقى موجود حتى بعد حذف/إعادة تثبيت
          # التطبيق (لأنه خارج مجلد التطبيق).
          cat > android/app/src/main/java/com/achfrirachid/tatabbou/SafFolderPlugin.java << 'EOF'
          package com.achfrirachid.tatabbou;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import androidx.activity.result.ActivityResult;
          import androidx.documentfile.provider.DocumentFile;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.io.ByteArrayOutputStream;
          @CapacitorPlugin(name = "SafFolder")
          public class SafFolderPlugin extends Plugin {
              private static final String PREFS = "saf_storage_prefs";
              private static final String KEY_URI = "saf_folder_uri";
              private SharedPreferences prefs() {
                  return getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }
              @PluginMethod
              public void pickFolder(PluginCall call) {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION
                          | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(call, intent, "pickFolderResult");
              }
              @ActivityCallback
              private void pickFolderResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  JSObject ret = new JSObject();
                  if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null) {
                      ret.put("uri", (String) null);
                      call.resolve(ret);
                      return;
                  }
                  Uri uri = result.getData().getData();
                  if (uri == null) {
                      ret.put("uri", (String) null);
                      call.resolve(ret);
                      return;
                  }
                  try {
                      getContext().getContentResolver().takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      );
                  } catch (Exception e) { /* بعض الأجهزة كتعطي الإذن مباشرة بلا الحاجة لهاد السطر */ }
                  prefs().edit().putString(KEY_URI, uri.toString()).apply();
                  ret.put("uri", uri.toString());
                  call.resolve(ret);
              }
              @PluginMethod
              public void hasFolder(PluginCall call) {
                  String saved = prefs().getString(KEY_URI, null);
                  JSObject ret = new JSObject();
                  if (saved == null) { ret.put("uri", (String) null); call.resolve(ret); return; }
                  try {
                      DocumentFile dir = DocumentFile.fromTreeUri(getContext(), Uri.parse(saved));
                      if (dir != null && dir.canWrite()) { ret.put("uri", saved); call.resolve(ret); return; }
                  } catch (Exception e) { /* الإذن ولا كاين */ }
                  prefs().edit().remove(KEY_URI).apply();
                  ret.put("uri", (String) null);
                  call.resolve(ret);
              }
              @PluginMethod
              public void clearFolder(PluginCall call) {
                  prefs().edit().remove(KEY_URI).apply();
                  call.resolve();
              }
              @PluginMethod
              public void writeFile(PluginCall call) {
                  String filename = call.getString("filename");
                  String data = call.getString("data");
                  if (filename == null || data == null) { call.reject("filename_and_data_required"); return; }
                  String saved = prefs().getString(KEY_URI, null);
                  if (saved == null) { call.reject("no_folder_selected"); return; }
                  try {
                      DocumentFile dir = DocumentFile.fromTreeUri(getContext(), Uri.parse(saved));
                      if (dir == null || !dir.canWrite()) { call.reject("folder_not_writable"); return; }
                      DocumentFile existing = dir.findFile(filename);
                      if (existing != null) existing.delete();
                      DocumentFile file = dir.createFile("application/json", filename);
                      if (file == null) { call.reject("create_file_failed"); return; }
                      OutputStream os = getContext().getContentResolver().openOutputStream(file.getUri(), "wt");
                      if (os == null) { call.reject("open_stream_failed"); return; }
                      os.write(data.getBytes("UTF-8"));
                      os.flush();
                      os.close();
                      JSObject ret = new JSObject();
                      ret.put("ok", true);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("write_failed: " + e.getMessage());
                  }
              }
              @PluginMethod
              public void readFile(PluginCall call) {
                  String filename = call.getString("filename");
                  if (filename == null) { call.reject("filename_required"); return; }
                  String saved = prefs().getString(KEY_URI, null);
                  if (saved == null) { call.reject("no_folder_selected"); return; }
                  try {
                      DocumentFile dir = DocumentFile.fromTreeUri(getContext(), Uri.parse(saved));
                      if (dir == null) { call.reject("folder_not_found"); return; }
                      DocumentFile file = dir.findFile(filename);
                      if (file == null) { call.reject("file_not_found"); return; }
                      InputStream is = getContext().getContentResolver().openInputStream(file.getUri());
                      if (is == null) { call.reject("open_stream_failed"); return; }
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = is.read(buf)) != -1) bos.write(buf, 0, n);
                      is.close();
                      JSObject ret = new JSObject();
                      ret.put("data", new String(bos.toByteArray(), "UTF-8"));
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject("read_failed: " + e.getMessage());
                  }
              }
          }
          EOF
          cat > android/app/src/main/java/com/achfrirachid/tatabbou/MainActivity.java << 'EOF'
          package com.achfrirachid.tatabbou;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(WhatsAppSharePlugin.class);
              registerPlugin(NotificationPermissionPlugin.class);
              registerPlugin(SafFolderPlugin.class);
              super.onCreate(savedInstanceState);
              requestNotificationPermissionIfNeeded();
            }
            private void requestNotificationPermissionIfNeeded() {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                if (ActivityCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                  ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 9021);
                }
              }
            }
          }
          EOF
      - name: Ensure internet permissions are declared
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
      - name: Declare package visibility for WhatsApp (Android 11+ requirement)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q '<queries>' "$MANIFEST"; then
            sed -i '/<\/manifest>/i\    <queries>\n        <package android:name="com.whatsapp" />\n    </queries>' "$MANIFEST"
          fi

      - name: Add notification permission (needed for monthly/holiday reminders)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST" || \
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"

      - name: Add manage-storage permission (persist offline backup across app uninstall)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.MANAGE_EXTERNAL_STORAGE' "$MANIFEST" || \
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' "$MANIFEST"

      - name: Add google-services.json (needed for @capacitor-firebase/authentication)
        run: |
          echo "${GOOGLE_SERVICES_JSON_BASE64}" | tr -d '[:space:]' | base64 -d -i > android/app/google-services.json
          echo "----- google-services.json content check -----"
          cat android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Add play-services-auth dependency (fixes crash on launch with providers:["google.com"])
        run: |
          GRADLE=android/app/build.gradle
          grep -q 'play-services-auth' "$GRADLE" || \
          sed -i '/dependencies {/a\    implementation "com.google.android.gms:play-services-auth:21.2.0"' "$GRADLE"

      - name: Add documentfile dependency (needed for SafFolderPlugin / SD-card storage)
        run: |
          GRADLE=android/app/build.gradle
          grep -q 'androidx.documentfile:documentfile' "$GRADLE" || \
          sed -i '/dependencies {/a\    implementation "androidx.documentfile:documentfile:1.0.1"' "$GRADLE"

      - name: Apply google-services Gradle plugin (needed for Google Sign-In)
        run: |
          PROJECT_GRADLE=android/build.gradle
          grep -q "com.google.gms:google-services" "$PROJECT_GRADLE" || \
          sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" "$PROJECT_GRADLE"
          APP_GRADLE=android/app/build.gradle
          grep -q "com.google.gms.google-services" "$APP_GRADLE" || \
          echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"

      - name: Use a fixed debug keystore (so SHA-1 stays stable across builds)
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android || true

      - name: Sync web assets into native project
        run: npx cap sync android

      - name: Apply custom app icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp android-icon/ic_launcher-$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp android-icon/ic_launcher_round-$d.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp android-icon/ic_launcher_foreground-$d.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
            cp android-icon/ic_launcher_background-$d.png android/app/src/main/res/mipmap-$d/ic_launcher_background.png
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp android-icon/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android-icon/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
